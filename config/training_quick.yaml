# Quick validation configuration (~10-20 minutes on Chr19)
# Tests min vs min+max features with minimal other parameters

optimizer:
  n_rounds: 2
  n_points_initial: 9
  n_points_refine: 30
  cv_folds: 3
  n_jobs: -1
  verbose: true
  max_iter: 20000

param_grid:
  # Test both min-only and min+max features
  # Expert guidance: "model will mostly weight min"
  # Min-only now includes: s5, sBP, s3, min_5_bp, min_5_3, min_all,
  #                        neg_absdiff_5_bp, neg_absdiff_5_3, neg_absdiff_bp_3 (9D)
  estimator__augment__include_max: [false, true]

  # Fix other parameters to typical good values
  estimator__svc__dual: [false]  # Required for L1
  estimator__svc__penalty: ['l2']  # Use L2 for quick test (L1 slower)
  estimator__svc__loss: ['squared_hinge']  # Required for L1 compatibility
  estimator__svc__intercept_scaling: [1000.0]
  method: ['sigmoid']  # Faster and safer than isotonic
