# ============================================================================
# intronIC Quick Training Configuration
# ============================================================================
# Fast validation config (~10-20 minutes on Chr19)
# For quick sanity checks during development
#
# Corrected Architecture (2025-01-17):
# - ScoreNormalizer: RobustScaler(with_centering=True)
# - Pipeline: BothEndsStrongTransformer → LinearSVC → CalibratedClassifierCV
# - Two-stage optimization: C (balanced_accuracy) then method (log-loss)
# ============================================================================

optimizer:
  n_rounds: 2
  n_points_initial: 9
  n_points_refine: 30
  cv_folds: 3
  n_jobs: -1
  verbose: true
  max_iter: 20000
  random_state: 42

# CORRECTED ARCHITECTURE: Simplified grid (7D features, L2 penalty)
param_grid:
  # BothEndsStrong min features only (7D total)
  # Features: five_z, bp_z, three_z, min_all,
  #           neg_absdiff_5_bp, neg_absdiff_5_3, neg_absdiff_bp_3
  include_pairwise_mins: [false]

  # No max features (don't reward one-end-strong FPs)
  include_max: [false]

# Training settings
training:
  n_models: 1  # Single model for quick testing
  subsample_u2: false
  subsample_ratio: 0.85
  max_iter: 20000
  random_state: 42
