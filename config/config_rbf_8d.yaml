# ==========================================================================
# intronIC v2 — RBF SVM, 8D (7Dv5 + bp_scan_confidence)
# ==========================================================================
#
# RBF variant of config_linear_8d. See that file for full feature docs.
#
# Features (8D total):
#   s5, sBP, s3            — core motif log-ratio z-scores (3'SS core-only)
#   support2               — second_largest of positive z-score parts
#   bp_offset              — branch A distance from 3'SS
#   ppt_t_weighted         — unmasked T-weighted pyrimidine score
#   ppt_longest_run        — unmasked longest pyrimidine run
#   bp_scan_confidence     — log2(best/mean) BPS scan sharpness

# ==========================================================================
# SCORING & CLASSIFICATION
# ==========================================================================
scoring:
  regions:
    three_prime: {start: -6, end: 4}
  threshold: 90.0
  feature_type: "both"
  exclude_noncanonical: false
  pseudocount: 0.0001
  ignore_nc_dinucleotides: true
  u12_boundary_correction: true

# ==========================================================================
# TRAINING & ENSEMBLE
# ==========================================================================
training:
  eval_mode: "nested_cv"
  n_cv_folds: 7
  test_fraction: 0.2
  ensemble:
    n_models: 15
    subsample_u2: true
    subsample_ratio: 0.80
    max_iter: 50000
    random_state: 42
  use_fold_averaged_params: false

# ==========================================================================
# HYPERPARAMETER OPTIMIZATION
# ==========================================================================
optimizer:
  n_rounds: 7
  n_points_initial: 25
  n_points_refine: 100
  cv_folds: 7
  random_state: 42
  n_jobs: -1
  verbose: true
  max_iter: 75000

  scoring_metric: 'balanced_accuracy'
  penalty_options: ['l1', 'l2']
  loss_options: ['squared_hinge']
  class_weight_multipliers: [0.8, 0.9, 1.0, 1.1, 1.2]
  use_multiplier_tiebreaker: true

  feature_transform:
    features: ['support2']
    extra_features: ['bp_offset', 'ppt_t_weighted', 'ppt_longest_run', 'bp_scan_confidence']

  kernel: 'rbf'
  gamma: 'scale'
  gamma_search: [0.001, 0.01, 0.1, 0.5, 'scale']

  early_stop_on_plateau: true
  plateau_rounds: 4

param_grid: {}

# ==========================================================================
# RUNTIME
# ==========================================================================
performance:
  processes: 6
  min_intron_length: 30

isoform:
  allow_multiple_isoforms: false
  exclude_overlapping: false
  include_duplicates: false

output:
  clean_names: true

extraction:
  flank_length: 50

advanced:
  random_seed: 42
  quiet: false
  debug: false
