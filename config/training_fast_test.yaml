# ============================================================================
# intronIC Fast Test Configuration
# ============================================================================
# Ultra-fast testing config for development (~5-10 minutes on Chr19)
# For rapid iteration during feature development
#
# Corrected Architecture (2025-01-17):
# - ScoreNormalizer: RobustScaler(with_centering=True)
# - Pipeline: BothEndsStrongTransformer → LinearSVC → CalibratedClassifierCV
# - Two-stage optimization: C (balanced_accuracy) then method (log-loss)
# ============================================================================

optimizer:
  # Minimal optimization for smoke testing
  n_rounds: 1
  n_points_initial: 3
  n_points_refine: 20
  cv_folds: 2
  n_jobs: -1
  verbose: true
  max_iter: 3000
  random_state: 42

# CORRECTED ARCHITECTURE: Minimal grid for fast testing
param_grid:
  # BothEndsStrong min features only (7D total)
  # Features: five_z, bp_z, three_z, min_all,
  #           neg_absdiff_5_bp, neg_absdiff_5_3, neg_absdiff_bp_3
  include_pairwise_mins: [false]

  # No max features (don't reward one-end-strong FPs)
  include_max: [false]

# Training settings
training:
  n_models: 1  # Single model for smoke testing
  subsample_u2: false
  max_iter: 3000
  random_state: 42

# Optional: Subsample reference data for ultra-fast testing
# Uncomment to use only 20% of reference data
# reference_subsample:
#   u12_fraction: 0.2
#   u2_fraction: 0.2
