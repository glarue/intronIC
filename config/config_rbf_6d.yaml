# ============================================================================
# intronIC v2.2 — RBF 6D Configuration
# ============================================================================
#
# 6D: 3 core z-scores + support2 + bp_offset + bp_scan_confidence (gap metric)
# Drops ppt_t_weighted and ppt_longest_run.
# CLI arguments override these settings.
#
# Auto-loaded from (in order of precedence):
#   1. --config PATH (explicit CLI argument)
#   2. ./.intronIC.yaml (current directory)
#   3. ~/.config/intronIC/config.yaml (XDG config dir)
#   4. ~/.intronIC.yaml (user home)
#   5. <install_dir>/config/config.yaml (built-in defaults)
#
# ============================================================================

# ============================================================================
# SCORING & CLASSIFICATION
# ============================================================================
scoring:
  # 3'SS window narrowed to core-only (-6 to +3) to separate PPT signal
  # from the acceptor motif. PPT is scored separately via dedicated features.
  regions:
    three_prime: {start: -6, end: 4}

  # Classification threshold (0-100%).
  # Introns with SVM probability >= threshold are classified as U12-type.
  threshold: 90.0

  # Feature type to extract introns from:
  #   "cds"  — coding sequence only (excludes UTR introns)
  #   "exon" — all exon features (includes UTR introns)
  #   "both" — CDS where available, fall back to exon (recommended)
  feature_type: "both"

  # When true, only GT-AG, GC-AG, and AT-AC introns are scored.
  exclude_noncanonical: false

  # Small value added to PWM frequencies to prevent log(0).
  pseudocount: 0.0001

  # Mask terminal dinucleotide positions when scoring non-canonical introns.
  ignore_nc_dinucleotides: true

  # Search ±6bp around splice sites for strong U12 motifs (e.g. ATATCCTT).
  # If found at an offset, adjust boundaries. Corrected introns tagged [c:shift].
  u12_boundary_correction: true
  u12_correction_require_canonical: true

# ============================================================================
# TRAINING & ENSEMBLE
# ============================================================================
training:
  eval_mode: "nested_cv"       # "nested_cv" | "split" | "none"
  n_cv_folds: 7
  test_fraction: 0.2

  ensemble:
    n_models: 15               # 15-model ensemble for robust probability estimates
    subsample_u2: true         # Each model sees a different random U2 subset
    subsample_ratio: 0.80      # Fraction of U2 per model
    max_iter: 50000
    random_state: 42

  use_fold_averaged_params: false

# ============================================================================
# HYPERPARAMETER OPTIMIZATION
# ============================================================================
optimizer:
  n_rounds: 7
  n_points_initial: 25
  n_points_refine: 100
  cv_folds: 7
  random_state: 42
  n_jobs: -1
  verbose: true
  max_iter: 75000

  scoring_metric: 'balanced_accuracy'
  penalty_options: ['l1', 'l2']
  loss_options: ['squared_hinge']
  class_weight_multipliers: [0.8, 0.9, 1.0, 1.1, 1.2]
  use_multiplier_tiebreaker: true

  # ---- Feature engineering ----
  # 6D feature set: 3 base z-scores + 1 composite + 2 extras
  #
  # Composite features (computed from z-scores by BothEndsStrongTransformer):
  #   support2: second_largest(max(0,s5z), max(0,BPz), max(0,s3z))
  #             "at least two sites support U12" — zero when only one is positive
  #
  # Extra features (from IntronScores, bypass the transformer):
  #   bp_offset:          branch A distance from 3'SS (negative int, e.g. -13)
  #   bp_scan_confidence: log2(best/2nd_best) BPS motif isolation across scan
  feature_transform:
    features: ['support2']
    extra_features: ['bp_offset', 'bp_scan_confidence']

  # RBF kernel with gamma grid search
  kernel: 'rbf'
  gamma: 'scale'
  gamma_search: [0.001, 0.01, 0.1, 0.5, 'scale']

  early_stop_on_plateau: true
  plateau_rounds: 4

param_grid: {}

# ============================================================================
# RUNTIME
# ============================================================================
performance:
  processes: 6
  min_intron_length: 30

isoform:
  allow_multiple_isoforms: false
  exclude_overlapping: false
  include_duplicates: false

output:
  clean_names: true

extraction:
  flank_length: 50

advanced:
  random_seed: 42
  quiet: false
  debug: false
