# ============================================================================
# intronIC v2.2 — RBF 6D Configuration
# ============================================================================
#
# 6D: 3 core z-scores + support2 + bp_offset + bp_scan_confidence (gap metric)
# Drops ppt_t_weighted and ppt_longest_run.
# CLI arguments override these settings.
#
# Auto-loaded from (in order of precedence):
#   1. --config PATH (explicit CLI argument)
#   2. ./.intronIC.yaml (current directory)
#   3. ~/.config/intronIC/config.yaml (XDG config dir)
#   4. ~/.intronIC.yaml (user home)
#   5. <install_dir>/config/config.yaml (built-in defaults)
#
# ============================================================================

# ============================================================================
# SCORING & CLASSIFICATION
# ============================================================================
scoring:
  # 3'SS window narrowed to core-only (-6 to +3) to separate PPT signal
  # from the acceptor motif. PPT is scored separately via dedicated features.
  regions:
    three_prime: {start: -6, end: 4}

  # Classification threshold (0-100%).
  # Introns with adjusted_score >= threshold are considered high-confidence U12.
  # The adjusted_score incorporates species-level valley prior and ensemble σ
  # penalty (see score_adjustment below). The binary type_id (U12/U2) is set
  # by the raw SVM decision boundary and is not affected by this threshold.
  threshold: 95.0

  # Feature type to extract introns from:
  #   "cds"  — coding sequence only (excludes UTR introns)
  #   "exon" — all exon features (includes UTR introns)
  #   "both" — CDS where available, fall back to exon (recommended)
  feature_type: "both"

  # When true, only GT-AG, GC-AG, and AT-AC introns are scored.
  exclude_noncanonical: false

  # Small value added to PWM frequencies to prevent log(0).
  pseudocount: 0.0001

  # Mask terminal dinucleotide positions when scoring non-canonical introns.
  ignore_nc_dinucleotides: true

  # Search ±6bp around splice sites for strong U12 motifs (e.g. ATATCCTT).
  # If found at an offset, adjust boundaries. Corrected introns tagged [c:shift].
  u12_boundary_correction: true
  u12_correction_require_canonical: true

  # Post-classification score adjustment (Bayesian prior + epistemic uncertainty).
  # Adjusts SVM probabilities using two independent signals:
  #
  #   1. Valley prior: species-level population evidence from 2D KDE bimodality
  #      (5'z, BPz). Deep valley → trust SVM. No valley → discount probability.
  #   2. Ensemble σ: per-intron model disagreement. High σ → less confidence.
  #
  # Formula (log-odds space):
  #   logit(p_adj) = logit(p_svm) + log(π_species / 0.5) - k_sigma * σ
  #
  # The valley-to-prior mapping uses a sigmoid centered at valley_midpoint:
  #   π_species = prior_floor + sigmoid(valley_depth) * (0.5 - prior_floor)
  #   transition zone = [midpoint - width/2, midpoint + width/2]
  #
  # Output: adjusted_score and ensemble_sigma columns in score_info.
  # rel_score in meta/score_info = adjusted_score - threshold.
  score_adjustment:
    enabled: true
    valley_midpoint: 0.3        # Center of discount→trust transition (valley depth 0-1).
                                # Below: strong discounting. Above: trust SVM.
                                # Set between known U12-absent (≤0.13) and U12-present (≥0.65) species.
    transition_width: 0.25      # Valley depth range for the sigmoid transition.
                                # Transition zone = [midpoint - width/2, midpoint + width/2] = [0.175, 0.425].
                                # Narrower = sharper cutoff; wider = more gradual.
    prior_floor: 0.001          # Minimum species-level prior for no-valley species.
                                # At floor=0.001, a 99% SVM score adjusts to ~41% (valley=0).
    k_sigma: 3.0                # Ensemble disagreement penalty in log-odds per σ unit.
                                # σ is std of per-model probabilities (0-1 scale).
                                # Most introns have σ≈0; this penalizes rare high-σ outliers.

  # Species-specific U2 background correction.
  # Blends empirical per-position nucleotide frequencies from the species'
  # own intron pool into the U2 denominator PWMs, correcting composition
  # bias without touching the U12 numerator.
  species_background:
    enabled: true
    n0: 1000                  # Bayesian shrinkage strength: w = n / (n + n0)
    trim_percentile: 0        # % of top-scoring introns to exclude (0 = none)
    pseudocount_per_base: 1.0 # Dirichlet pseudocount per base per position
    n_iterations: 0           # Iterative re-trimming passes (0 = single pass)
    min_introns: 500          # Skip correction if fewer introns than this

# ============================================================================
# TRAINING & ENSEMBLE
# ============================================================================
training:
  eval_mode: "nested_cv"       # "nested_cv" | "split" | "none"
  n_cv_folds: 7
  test_fraction: 0.2

  ensemble:
    n_models: 30               # 30-model ensemble for stable σ estimates
    subsample_u2: true         # Each model sees a different random U2 subset
    subsample_ratio: 0.80      # Fraction of U2 per model
    max_iter: 50000
    random_state: 42
    feature_dropout: 0         # 0 = disabled. All models see all features.
                               # Ensemble variance from U2 subsampling alone provides
                               # sufficient σ signal (5x gap between real U12 and FPs).

  use_fold_averaged_params: false

# ============================================================================
# HYPERPARAMETER OPTIMIZATION
# ============================================================================
optimizer:
  n_rounds: 7
  n_points_initial: 25
  n_points_refine: 25               # 100 → 25: finer resolution is wasted on log-scale C
  cv_folds: 7
  random_state: 42
  n_jobs: -1
  verbose: true
  max_iter: 75000

  scoring_metric: 'balanced_accuracy'
  penalty_options: ['l1', 'l2']     # Only affects linear kernel; ignored for RBF
  loss_options: ['squared_hinge']
  class_weight_multipliers: [1.0]   # Balanced weights already computed internally
  use_multiplier_tiebreaker: true

  # ---- Feature engineering ----
  # 6D feature set: 3 base z-scores + 1 composite + 2 extras
  #
  # Composite features (computed from z-scores by BothEndsStrongTransformer):
  #   support2: second_largest(max(0,s5z), max(0,BPz), max(0,s3z))
  #             "at least two sites support U12" — zero when only one is positive
  #
  # Extra features (from IntronScores, bypass the transformer):
  #   bp_offset:          branch A distance from 3'SS (negative int, e.g. -13)
  #   bp_scan_confidence: log2(best/2nd_best) BPS motif isolation across scan
  feature_transform:
    features: ['support2']
    extra_features: ['bp_offset', 'bp_scan_confidence']

  # RBF kernel with gamma grid search
  kernel: 'rbf'
  gamma: 'scale'
  gamma_search: [0.001, 0.01, 0.1, 0.5, 'scale']

  early_stop_on_plateau: true
  plateau_rounds: 4

param_grid: {}

# ============================================================================
# RUNTIME
# ============================================================================
performance:
  processes: 6
  min_intron_length: 30

isoform:
  allow_multiple_isoforms: false
  exclude_overlapping: false
  include_duplicates: false

output:
  clean_names: true

extraction:
  flank_length: 50

advanced:
  random_seed: 42
  quiet: false
  debug: false
