# ============================================================================
# intronIC v2.0 - Default Training Configuration
# ============================================================================
# Production configuration for corrected architecture (2025-01-17)
#
# CORRECTED ARCHITECTURE:
# - ScoreNormalizer: RobustScaler(with_centering=True) - single scaling step
# - Pipeline: BothEndsStrongTransformer → LinearSVC → CalibratedClassifierCV
# - Two-stage optimization: C (balanced_accuracy), then method (log-loss)
# - Result: 2 FPs on C. elegans (vs 130 uncentered, 49 centered-only)
#
# For faster testing: training_quick.yaml or training_fast_test.yaml
#
# Usage:
#   intronIC train -n homo_sapiens --optimizer-config config/training_default.yaml
#
# ============================================================================

# ============================================================================
# HYPERPARAMETER OPTIMIZATION
# ============================================================================
# Controls the grid search for optimal SVM and feature parameters
optimizer:
  # Number of geometric refinement rounds (1-5)
  # - Round 1: Coarse grid over full C range
  # - Rounds 2+: Refine around best C from previous round
  # - Production: 3-5 rounds (3 is good balance of thoroughness vs speed)
  # - Fast testing: 1-2 rounds
  n_rounds: 5

  # Initial grid points for round 1 (7-13 typical)
  # - Number of C values to test in first round
  # - More points = better coverage but slower
  # - Production: 11-13 points
  # - Fast testing: 3-7 points
  n_points_initial: 13

  # Refinement grid points for rounds 2+ (20-100 typical)
  # - Number of C values to test in refinement rounds
  # - Higher = finer granularity around optimal region
  # - Production: 50-100 points
  # - Fast testing: 20-30 points
  n_points_refine: 100

  # Cross-validation folds (3-5 typical)
  # - Number of folds for parameter validation
  # - 5 = standard, provides robust estimates
  # - 3 = faster, still reasonable
  # Note: CalibratedClassifierCV adds another 3-fold internal CV,
  #       so total model fits per parameter set = cv_folds × 3
  cv_folds: 7

  # Random seed for reproducibility
  # - Ensures same train/test splits across runs
  # - Change to get different random splits
  random_state: 42

  # Number of parallel jobs for GridSearchCV
  # - -1 = use all available CPU cores
  # - 1 = sequential (easier to debug)
  # - N = use N cores
  n_jobs: -1

  # Print detailed progress messages
  # - true = show optimization progress, CV results, timings
  # - false = quiet mode (only warnings/errors)
  verbose: true

  # Maximum iterations for LinearSVC convergence
  # - Higher = allows convergence on difficult datasets
  # - Lower = faster but may not converge (warns if hit)
  # - Production: 50000-100000
  # - Fast testing: 3000-10000
  max_iter: 50000

# ============================================================================
# PARAMETER GRID (CORRECTED ARCHITECTURE - 2025-01-17)
# ============================================================================
# Defines the hyperparameter space to search
#
# CORRECTED ARCHITECTURE (Single Scaling Step):
# - ScoreNormalizer: RobustScaler(with_centering=True) transforms raw LLRs → z-scores
#   * Centering removes composition bias (critical for cross-species)
#   * Applied OUTSIDE the ML pipeline (single scaling step)
# - Pipeline: BothEndsStrongTransformer → LinearSVC → CalibratedClassifierCV
#   * NO scaler in pipeline (would cause double-scaling)
#   * BothEndsStrongTransformer: 7D features (z-scores + augmented features)
# - Two-Stage Optimization:
#   * Stage 1: Optimize C using balanced_accuracy (discrimination quality)
#   * Stage 2: Select calibration method using log-loss (probability quality)
#
# KEY CHANGES FROM PREVIOUS:
# - Removed: All clipping/saturation transforms (don't transfer cross-species)
# - Removed: Scaler from pipeline (was causing double-scaling)
# - Fixed: BothEndsStrongTransformer parameters (7D non-redundant features)
# - Fixed: L2-only penalty (L1 zeroed critical min/neg_absdiff features)
# - Simplified: Two-stage optimization (C first, then calibration method)
#
# RESULT: 2 FPs on C. elegans (vs 130 uncentered, 49 centered-only, 6-8 old v1.5.1)
#
# References: SCALER_CENTERING_FIX_COMPLETE.md, test_corrected_architecture.py
param_grid:
  # BothEndsStrong feature set - Pairwise mins
  # Controls which min features to include:
  # - false = Only min_all (RECOMMENDED - 7D total, non-redundant)
  #           Features: five_z, bp_z, three_z, min_all,
  #                     neg_absdiff_5_bp, neg_absdiff_5_3, neg_absdiff_bp_3
  #           min_all = min(five_z, bp_z, three_z) captures all constraints
  # - true = Pairwise mins + min_all (9D total, redundant)
  #          Adds: min_5_bp, min_5_3 (redundant with min_all)
  # CORRECTED ARCH: Fixed to false (simpler, non-redundant, validated)
  # NOTE: Prefix with 'transform__' for pipeline step 'transform' (BothEndsStrongTransformer)
  transform__include_pairwise_mins: [false]

  # BothEndsStrong feature set - Max features
  # - false = No max features (RECOMMENDED - don't reward one-end-strong FPs)
  # - true = Adds max_5_bp, max_5_3 (can increase false positives)
  # Expert: "model will mostly weight min" - max features not needed
  # CORRECTED ARCH: Fixed to false (suppress one-end-strong FPs)
  # NOTE: Prefix with 'transform__' for pipeline step 'transform' (BothEndsStrongTransformer)
  transform__include_max: [false]

  # FIXED PARAMETERS (not in grid, set by optimizer/trainer):
  # - C: Optimized via Stage 1 geometric grid search (balanced_accuracy)
  # - penalty: 'l2' (L2 only - keeps all features weighted appropriately)
  # - calibration_method: Selected via Stage 2 comparison (sigmoid vs isotonic, log-loss)
  # - dual: False (primal formulation for n_samples >> n_features)
  # - loss: 'squared_hinge' (required for primal L2)
  # - class_weight: 'balanced' (handles U12/U2 imbalance)

# ============================================================================
# C PARAMETER BOUNDS (OPTIONAL)
# ============================================================================
# Controls the range of C (soft-margin penalty) values to search
# By default, C bounds are computed automatically from class weights to ensure
# balanced effective penalties. Leave commented to use auto-computed bounds.
#
# AUTO-COMPUTED BOUNDS (RECOMMENDED):
# - Default range: [1e-3, 1e3] effective C for positive class (U12)
# - Adjusted by class imbalance (typically ~1:50 U12:U2 ratio)
# - Results in weight-aware search range appropriate for dataset
#
# MANUAL OVERRIDE (Advanced):
# Uncomment the section below to specify custom C bounds
# c_bounds:
#   # Effective C range for positive class (U12)
#   # - Lower bound: more regularization, simpler decision boundary
#   # - Upper bound: less regularization, more complex boundary
#   # - Recommendation: Use defaults unless you have specific requirements
#   eff_C_pos_range: [0.001, 1000.0]
#
#   # Optional maximum effective C for negative class (U2)
#   # - null = no limit (allow effective C_neg to grow with class weight)
#   # - float = cap effective C_neg at this value
#   # - Useful if U2 class becomes over-penalized
#   eff_C_neg_max: null

# ============================================================================
# ENSEMBLE TRAINING
# ============================================================================
# Controls training of multiple models with different random subsamples
# Models are averaged for final predictions (reduces variance)
training:
  # Number of models in ensemble
  # - 1 = single model (faster, less robust)
  # - 3-5 = typical ensemble (good balance)
  # - 10+ = very robust but slower
  # Recommendation: 3 for production, 1 for fast testing
  n_models: 7

  # Whether to subsample U2 set for each model
  # - true = Each model sees different random U2 subset (more diversity)
  # - false = All models see same U2 set (faster, less diverse)
  # Only applies when n_models > 1
  # Recommendation: true for ensemble diversity
  subsample_u2: true

  # Fraction of U2 introns to use per model (if subsample_u2=true)
  # - 0.8 = use 80% of U2s for each model
  # - 1.0 = use all U2s (no subsampling, same as subsample_u2=false)
  # Only applies when subsample_u2=true
  # Recommendation: 0.7-0.9 for good diversity without losing too much data
  subsample_ratio: 0.85

  # Maximum iterations for LinearSVC convergence
  # - Separate from optimizer.max_iter (which is for parameter search)
  # - Used during final ensemble training
  # - Production: 20000-50000
  # - Fast testing: 3000-10000
  max_iter: 25000

  # Random seed for ensemble training
  # - Controls U2 subsampling randomness
  # - Set to same value as optimizer.random_state for full reproducibility
  random_state: 42

  # Use fold-averaged hyperparameters from nested CV
  # - false = Re-optimize C and calibration on full dataset after nested CV (default sklearn behavior)
  #           * Maximizes performance on training data
  #           * May overfit to training species composition
  # - true = Use geometric mean of fold-specific C values and majority-vote calibration
  #          * More conservative, favors generalization over training fit
  #          * RECOMMENDED for cross-species applications
  #          * Expected to reduce FPs on distant species (e.g., C. elegans: 2 FPs vs 6 FPs)
  # Only applies when eval_mode='nested_cv'
  # Note: For same-species prediction, default (false) is better
  use_fold_averaged_params: false

# ============================================================================
# NOTES & RECOMMENDATIONS
# ============================================================================
#
# ESTIMATED RUNTIME (on typical workstation):
# - Chr19 only: ~30-60 minutes (5 folds × 3 rounds)
# - Full human genome: ~3-6 hours
# - Use training_quick.yaml for faster validation (~10-20 min on Chr19)
# - Use training_fast_test.yaml for smoke testing (~5-10 min on Chr19)
#
# PARALLELIZATION:
# - Controlled by optimizer.n_jobs (for hyperparameter search)
# - GridSearchCV parallelizes across C values
# - Each C value: cv_folds fits (Stage 1), then 2 calibration methods (Stage 2)
# - Memory usage scales with n_jobs (more cores = more memory)
#
# MEMORY USAGE:
# - Typical: 2-5 GB for Chr19
# - Full genome: 10-20 GB
# - Scales with: number of introns, n_jobs, ensemble size
#
# ARCHITECTURE NOTES:
# - include_max/include_pairwise_mins: Fixed to false (7D non-redundant features)
# - penalty: L2 only (keeps all features appropriately weighted)
# - calibration_method: Auto-selected (sigmoid vs isotonic) via log-loss
# - C: Auto-optimized via geometric grid search (balanced_accuracy)
#
# FAST TESTING DURING DEVELOPMENT:
# - Use training_quick.yaml (2 rounds, 3 CV folds)
# - Or training_fast_test.yaml (1 round, 2 CV folds, minimal grid)
# - Reduce n_models to 1 for single-model testing
#
# REFERENCES:
# - Architecture: SCALER_CENTERING_FIX_COMPLETE.md
# - Tests: test_corrected_architecture.py
# - Validation: C. elegans 2 FPs (vs 130 uncentered, 49 centered-only)
#
# ============================================================================
