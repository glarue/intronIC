[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intronIC"
version = "1.5.1"
description = "Intron classification tool for identifying U2-type and U12-type introns using SVM"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Graham E. Larue", email = "egrahamlarue@gmail.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy<2.0",
    "scipy",
    "scikit-learn>=0.22",
    "biogl",
    "matplotlib",
    "networkx>=2.5.1",
    "rich>=10.0",
]

[project.urls]
Homepage = "https://github.com/glarue/intronIC"
Repository = "https://github.com/glarue/intronIC"
Issues = "https://github.com/glarue/intronIC/issues"

[project.scripts]
intronIC = "cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "extraction", "file_io", "scoring", "classification", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"intronIC/data" = "intronIC/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
