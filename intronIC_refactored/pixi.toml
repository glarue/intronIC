[workspace]
name = "intronIC"
version = "1.5.1"
description = "Intron classification tool for identifying U2-type and U12-type introns"
authors = ["Graham E. Larue <egrahamlarue@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.8,<3.13"
numpy = "<2.0"
scipy = "*"
scikit-learn = ">=0.22"
matplotlib = "*"
networkx = ">=2.5.1"
pytest = ">=8.4.2,<9"
rich = ">=14.2.0,<15"

[pypi-dependencies]
biogl = "*"

[tasks]
intronIC = "python -m intronIC.intronIC"
test-gold = "python -m intronIC.intronIC -g test_data/Homo_sapiens.Chr19.Ensembl_91.fa.gz -a test_data/Homo_sapiens.Chr19.Ensembl_91.gff3.gz -n homo_sapiens_gold"

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
mypy = "*"
ruff = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
