[project]
name = "intronic-refactored"
version = "1.5.1"
description = "Intron classification tool for identifying U2-type and U12-type introns using SVM (refactored version)"
authors = ["Graham E. Larue <egrahamlarue@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.8,<3.13"
numpy = "<2.0"
scipy = "*"
scikit-learn = ">=0.22"
matplotlib = "*"
networkx = ">=2.5.1"
rich = ">=10.0"
pip = "*"

[pypi-dependencies]
biogl = "*"

[tasks]
# Installation task to install in development mode
install = "pip install -e ."

# Run refactored intronIC (runs __main__.py directly, no install needed)
intronic = "python __main__.py"

# Test with small reference sets (fast, ~2-5 minutes)
test-small = """
python __main__.py \
  -g ../intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.fa.gz \
  -a ../intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.gff3.gz \
  -n homo_sapiens_test_small \
  --reference_u12s ../intronIC/data/u12_reference_small.introns.iic.gz \
  --reference_u2s ../intronIC/data/u2_reference_small.introns.iic.gz \
  -p 4
"""

# Test with full reference sets (~5-15 minutes)
test-full = """
python __main__.py \
  -g ../intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.fa.gz \
  -a ../intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.gff3.gz \
  -n homo_sapiens_test_full \
  -p 4
"""

# Extract sequences only (no classification, ~1-2 minutes)
test-seqs-only = """
python __main__.py \
  -g ../intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.fa.gz \
  -a ../intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.gff3.gz \
  -n homo_sapiens_seqs \
  -s
"""

# Legacy: Run old monolithic version (from parent directory)
intronic-legacy = "cd .. && python -m intronIC.intronIC"
test-legacy = "cd .. && python -m intronIC.intronIC -g intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.fa.gz -a intronIC/test_data/Homo_sapiens.Chr19.Ensembl_91.gff3.gz -n homo_sapiens_legacy"

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
mypy = "*"
ruff = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
